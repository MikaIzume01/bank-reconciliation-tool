<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekonsiliasi Bank Otomatis</title>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 0.75rem;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
        .wrapper { width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); }
        .header { margin-bottom: 2rem; text-align: center; }
        .header h1 { font-size: 1.75rem; color: var(--primary); margin-bottom: 0.5rem; }
        .header p { color: var(--text-muted); font-size: 0.95rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem; color: var(--text-main); }
        input[type="file"] { width: 100%; padding: 0.75rem; border: 2px dashed var(--border); border-radius: var(--radius); background: #f8fafc; cursor: pointer; transition: border-color 0.2s; }
        input[type="file"]:hover { border-color: var(--primary); }
        .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem; }
        .btn { display: block; width: 100%; background: var(--primary); color: #fff; padding: 0.875rem; border: none; border-radius: var(--radius); font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; text-align: center; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); }
        .sample-box { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted); text-align: center; }
        .sample-box code { background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>Rekonsiliasi Bank</h1>
                <p>Otomatisasi pencocokan Mutasi Bank dan Buku Besar perusahaan.</p>
            </div>
            <form action="/reconcile" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>File CSV Mutasi Bank</label>
                    <input type="file" name="bank_file" accept=".csv" required>
                    <div class="hint">Format kolom wajib: tanggal, keterangan, jumlah</div>
                </div>
                <div class="form-group">
                    <label>File CSV Buku Besar (Ledger)</label>
                    <input type="file" name="ledger_file" accept=".csv" required>
                    <div class="hint">Format kolom wajib: tanggal, keterangan, jumlah</div>
                </div>
                <button type="submit" class="btn">Proses Rekonsiliasi</button>
            </form>
            <div class="sample-box">
                Gunakan contoh file uji: <code>sample_bank.csv</code> &amp; <code>sample_ledger.csv</code> di direktori proyek.
            </div>
        </div>
    </div>
</body>
</html>
